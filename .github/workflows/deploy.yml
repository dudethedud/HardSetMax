# Builds the bot on GitHub and publishes it to the `deploy` branch (docs/OPERATIONS.md).
# The free host's CPU limit stops it during `npm install` and the TypeScript build,
# so the host only pulls `deploy` and runs `node start.js`: no install, no build.
# Every push to main runs the checks and tests first; a failing check publishes nothing.
name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # push the deploy branch

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: colours_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database for the tests; never real data.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/colours_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repo's .npmrc leaves dev tools out (for the host); the checks need them.
      - run: npm ci --include=dev

      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle

      # The deploy branch only ever holds the latest build (one commit, replaced each time).
      - name: Publish to the deploy branch
        working-directory: deploy
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7} from main"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
